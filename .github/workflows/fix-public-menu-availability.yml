name: Fix public menu availability regression

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/fix-public-menu-availability.yml

permissions:
  contents: write

concurrency:
  group: fix-public-menu-availability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout final integration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: perf/vistaire-final-free-tier-optimization
          fetch-depth: 0
          lfs: false
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Apply minimal public-only availability fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("lib/menu/publicMenu.ts")
          source = path.read_text(encoding="utf-8")
          before = "includeUnavailableDishes: true"
          after = "includeUnavailableDishes: false"
          count = source.count(before)
          if count != 2:
              raise SystemExit(
                  f"Expected exactly two public loader opt-ins, found {count}."
              )
          updated = source.replace(before, after)
          if updated.count(after) < 2 or before in updated:
              raise SystemExit("Public availability replacement was incomplete.")
          path.write_text(updated, encoding="utf-8")
          PY
          git diff --check
          git diff -- lib/menu/publicMenu.ts

      - name: Install dependencies
        run: npm ci

      - name: Focused public menu contracts
        run: |
          node --test \
            tests/public-menu-core.test.mjs \
            tests/public-menu-cache-contract.test.mjs
          npm run typecheck

      - name: Commit source fix only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vistaire-integration-bot"
          git config user.email "vistaire-integration-bot@users.noreply.github.com"
          git add lib/menu/publicMenu.ts
          test "$(git diff --cached --name-only)" = "lib/menu/publicMenu.ts"
          git diff --cached --check
          git commit -m "fix(menu): keep unavailable dishes private"
          git push origin HEAD:perf/vistaire-final-free-tier-optimization
