name: Vercel Preview Cleanup

on:
  pull_request:
    branches: [main]
    types: [closed]
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Cleanup mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
      confirmation:
        description: Required for manual apply
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: vistaire-vercel-preview-cleanup
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  VERCEL_TEAM_ID: team_F3dOq6TxZUocL6KtF64BTcPh
  VERCEL_PROJECT_ID: prj_Tn2FSuDWISKQ5feyW9wiGl6xFRbO
  VERCEL_CLEANUP_GRACE_MS: '3600000'

jobs:
  cleanup:
    name: Cleanup obsolete Preview deployments
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_CLEANUP_MODE: ${{ inputs.mode || 'dry-run' }}
      VERCEL_CLEANUP_CONFIRMATION: ${{ inputs.confirmation || '' }}
      VERCEL_CLEANUP_EVENT_ACTION: ${{ github.event.action || '' }}
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run Preview cleanup policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/ci/run-vercel-preview-cleanup.mjs
