name: Temporary Admin vNext Playwright browser export

on:
  push:
    branches:
      - feat/admin-vnext-integration

permissions:
  contents: read

jobs:
  export-playwright-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Use dependency manifests from current main
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- package.json package-lock.json

      - name: Setup project CI Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm

      - name: Install exact dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium
          npx playwright --version
          find "$HOME/.cache/ms-playwright" -maxdepth 3 -type f -name chrome -o -name headless_shell

      - name: Archive and split Playwright browser cache
        run: |
          tar --zstd -C "$HOME/.cache" -cf /tmp/vistaire-playwright-browser.tar.zst ms-playwright
          mkdir -p /tmp/vistaire-playwright-browser-parts
          split -b 250m -d -a 2 /tmp/vistaire-playwright-browser.tar.zst /tmp/vistaire-playwright-browser-parts/part-
          sha256sum /tmp/vistaire-playwright-browser.tar.zst /tmp/vistaire-playwright-browser-parts/part-*
          du -h /tmp/vistaire-playwright-browser.tar.zst /tmp/vistaire-playwright-browser-parts/part-*

      - name: Upload browser part 00
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: temp-vistaire-playwright-browser-part-00-${{ github.run_id }}
          path: /tmp/vistaire-playwright-browser-parts/part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload browser part 01
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: temp-vistaire-playwright-browser-part-01-${{ github.run_id }}
          path: /tmp/vistaire-playwright-browser-parts/part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
