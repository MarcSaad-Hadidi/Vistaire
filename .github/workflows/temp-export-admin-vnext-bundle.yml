name: Temporary Admin vNext dependency export

on:
  push:
    branches:
      - feat/admin-vnext-integration

permissions:
  contents: read

jobs:
  export-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Use dependency manifests from current main
        run: |
          git fetch --no-tags --depth=1 origin main
          git checkout FETCH_HEAD -- package.json package-lock.json

      - name: Setup Node matching the local execution environment
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Create split dependency archive
        run: |
          tar --zstd -cf /tmp/vistaire-node-modules.tar.zst node_modules
          mkdir -p /tmp/vistaire-node-modules-parts
          split -b 250m -d -a 2 /tmp/vistaire-node-modules.tar.zst /tmp/vistaire-node-modules-parts/part-
          sha256sum /tmp/vistaire-node-modules.tar.zst /tmp/vistaire-node-modules-parts/part-*
          du -h /tmp/vistaire-node-modules.tar.zst /tmp/vistaire-node-modules-parts/part-*

      - name: Upload dependency part 00
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: temp-vistaire-node-modules-part-00-${{ github.run_id }}
          path: /tmp/vistaire-node-modules-parts/part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload dependency part 01
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: temp-vistaire-node-modules-part-01-${{ github.run_id }}
          path: /tmp/vistaire-node-modules-parts/part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - name: Upload dependency part 02
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: temp-vistaire-node-modules-part-02-${{ github.run_id }}
          path: /tmp/vistaire-node-modules-parts/part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1

      - name: Upload dependency part 03
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: temp-vistaire-node-modules-part-03-${{ github.run_id }}
          path: /tmp/vistaire-node-modules-parts/part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 1
