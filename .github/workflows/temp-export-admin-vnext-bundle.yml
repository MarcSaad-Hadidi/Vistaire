name: Temporary Admin vNext Node runtime export

on:
  push:
    branches:
      - feat/admin-vnext-integration

permissions:
  contents: read

jobs:
  export-node-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout delivery branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Setup project CI Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0

      - name: Archive Node runtime
        run: |
          NODE_BIN="$(command -v node)"
          NODE_ROOT="$(dirname "$(dirname "$NODE_BIN")")"
          test -x "$NODE_ROOT/bin/node"
          tar --zstd -C "$NODE_ROOT" -cf /tmp/vistaire-node24-runtime.tar.zst .
          sha256sum /tmp/vistaire-node24-runtime.tar.zst
          du -h /tmp/vistaire-node24-runtime.tar.zst
          "$NODE_ROOT/bin/node" --version

      - name: Upload Node runtime
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: temp-vistaire-node24-runtime-${{ github.run_id }}
          path: /tmp/vistaire-node24-runtime.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
