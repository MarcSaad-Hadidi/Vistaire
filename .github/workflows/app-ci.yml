name: App CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: App checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: vistaire_qr_ci
          POSTGRES_PASSWORD: vistaire_qr_ci_password
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vistaire_qr_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check repository assets
        run: npm run assets:check

      - name: Check Git LFS policy
        run: npm run lfs:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unique menu Node tests
        run: npm run test:unique-menu-design

      - name: Unique menu PostgreSQL 17 tests
        env:
          PGDATABASE: vistaire_qr_ci
          PGHOST: 127.0.0.1
          PGPASSWORD: vistaire_qr_ci_password
          PGPORT: "5432"
          PGUSER: postgres
        run: npm run test:unique-menu-design:postgres

      - name: Maison Elyse media tests
        run: npm run test:maison-elyse-media

      - name: Landing renderer and image contracts
        run: npm run test:landing:contract

      - name: Landing locale and translation contracts
        run: npm run test:landing:i18n

      - name: Landing fixture locale integration
        run: npm run test:landing:fixture-i18n

      - name: Landing comparison keyboard contract
        run: npm run test:landing:keyboard

      - name: Translation backfill contracts
        run: npm run test:translation:backfill

      - name: Maison Elyse PostgreSQL 17 tests
        env:
          PGDATABASE: vistaire_qr_ci
          PGHOST: 127.0.0.1
          PGPASSWORD: vistaire_qr_ci_password
          PGPORT: "5432"
          PGUSER: postgres
        run: npm run test:maison-elyse-postgres

      - name: QR Node tests
        run: npm run test:qr:node

      - name: QR PostgreSQL 17 tests
        env:
          PGDATABASE: vistaire_qr_ci
          PGHOST: 127.0.0.1
          PGPASSWORD: vistaire_qr_ci_password
          PGPORT: "5432"
          PGUSER: postgres
        run: npm run test:qr:postgres

      - name: Build
        run: npm run build

      - name: Install Playwright WebKit
        run: npx --no-install playwright install --with-deps webkit

      - name: Landing production photo redirect
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:landing:production-photo

      - name: Landing redesign critical browser checks
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:landing:e2e

      - name: Sauge Noire critical smoke
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:sauge-noire:smoke

      - name: Sauge Noire first-gesture scroll
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:sauge-noire:scroll

      - name: Sauge Noire swipe intent
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:sauge-noire:swipe

      - name: Sauge Noire contents single flip
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:sauge-noire:contents-single-flip

      - name: Sauge Noire static-page parity
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:sauge-noire:static-parity

      - name: Sauge Noire comparison geometry
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:sauge-noire:comparison-geometry

      - name: QR functional Playwright tests
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:qr:functional

      - name: SEO hardening tests
        if: ${{ !cancelled() }}
        run: npm run test:seo

      - name: Admin and owner QR tests
        if: ${{ !cancelled() }}
        run: npm run test:admin

      - name: Bootstrap smoke e2e
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:smoke:bootstrap

      - name: SEO smoke e2e
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        env:
          PLAYWRIGHT_BROWSER_CHANNEL: chrome
        run: npm run test:seo:e2e

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            blob-report/
          if-no-files-found: ignore
          retention-days: 7

  app-ci:
    name: App CI
    if: ${{ always() }}
    needs:
      - checks
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
        run: |
          if [[ "$CHECKS_RESULT" != "success" ]]; then
            echo "App checks: $CHECKS_RESULT"
            exit 1
          fi
