name: App CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      target:
        description: Validation scope (targeted is the normal PR mode)
        required: true
        default: targeted
        type: choice
        options: [targeted, full, sauge, database, admin_qr, landing, seo]
  workflow_call:
    inputs:
      target:
        required: false
        default: full
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: vistaire-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24
  CI: true

jobs:
  classify-changes:
    name: classify-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      ci_infrastructure: ${{ steps.classify.outputs.ci_infrastructure }}
      dependencies: ${{ steps.classify.outputs.dependencies }}
      assets: ${{ steps.classify.outputs.assets }}
      core: ${{ steps.classify.outputs.core }}
      database: ${{ steps.classify.outputs.database }}
      translations: ${{ steps.classify.outputs.translations }}
      landing: ${{ steps.classify.outputs.landing }}
      seo: ${{ steps.classify.outputs.seo }}
      menu_shared: ${{ steps.classify.outputs.menu_shared }}
      sauge_renderer: ${{ steps.classify.outputs.sauge_renderer }}
      pageflip_gestures: ${{ steps.classify.outputs.pageflip_gestures }}
      admin: ${{ steps.classify.outputs.admin }}
      qr: ${{ steps.classify.outputs.qr }}
      full_ci: ${{ steps.classify.outputs.full_ci }}
      run_static: ${{ steps.classify.outputs.run_static }}
      run_database: ${{ steps.classify.outputs.run_database }}
      run_build: ${{ steps.classify.outputs.run_build }}
      run_core: ${{ steps.classify.outputs.run_core }}
      run_landing: ${{ steps.classify.outputs.run_landing }}
      run_menu: ${{ steps.classify.outputs.run_menu }}
      run_sauge: ${{ steps.classify.outputs.run_sauge }}
      run_admin_qr: ${{ steps.classify.outputs.run_admin_qr }}
      run_seo: ${{ steps.classify.outputs.run_seo }}
      run_webkit: ${{ steps.classify.outputs.run_webkit }}
      classification_valid: ${{ steps.classify.outputs.classification_valid }}
      event: ${{ steps.classify.outputs.event }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
      categories: ${{ steps.classify.outputs.categories }}
      reason: ${{ steps.classify.outputs.reason }}
      merge_base_depth: ${{ steps.graph.outputs.merge_base_depth }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Fetch minimal PR graph for merge-base
        id: graph
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ci/fetch-pr-graph.mjs
      - name: Classify changed files (fail closed)
        id: classify
        env:
          VISTAIRE_CI_TARGET: ${{ inputs.target || github.event.inputs.target || 'targeted' }}
          VISTAIRE_CI_EVENT: ${{ github.event_name }}
          VISTAIRE_CI_REF: ${{ github.ref }}
        run: node scripts/ci/detect-changes.mjs
      - name: Validate classifier outputs
        env:
          OUTPUTS_JSON: ${{ toJSON(steps.classify.outputs) }}
        run: |
          node --input-type=module - <<'NODE'
          const outputs = JSON.parse(process.env.OUTPUTS_JSON);
          const outputNames = ['docs_only','ci_infrastructure','dependencies','assets','core','database','translations','landing','seo','menu_shared','sauge_renderer','pageflip_gestures','admin','qr','full_ci','run_static','run_database','run_build','run_core','run_landing','run_menu','run_sauge','run_admin_qr','run_seo','run_webkit','classification_valid'];
          for (const key of outputNames) {
            if (!['true','false'].includes(outputs[key])) throw new Error(`classifier output ${key} is invalid`);
          }
          if (!outputs.event || !outputs.categories || !outputs.reason) throw new Error('classifier metadata is incomplete');
          NODE
      - name: Test classifier contract
        run: node --test tests/ci-change-detection.test.mjs
      - name: Publish classification summary
        env:
          CLASSIFY_EVENT: ${{ steps.classify.outputs.event }}
          CLASSIFY_CATEGORIES: ${{ steps.classify.outputs.categories }}
          CLASSIFY_FULL: ${{ steps.classify.outputs.full_ci }}
          CLASSIFY_REASON: ${{ steps.classify.outputs.reason }}
          CLASSIFY_CHANGED_FILES: ${{ steps.classify.outputs.changed_files }}
        run: |
          {
            printf '%s\n' '## Change classification'
            printf '%s\n' "- Event: ${CLASSIFY_EVENT}"
            printf '%s\n' "- Categories: ${CLASSIFY_CATEGORIES}"
            printf '%s\n' "- Full CI: ${CLASSIFY_FULL}"
            printf '%s\n' "- Reason: ${CLASSIFY_REASON}"
            printf '%s\n' "- Changed files: ${CLASSIFY_CHANGED_FILES}"
          } >> "$GITHUB_STEP_SUMMARY"

  fast-gate:
    name: fast-gate
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Validate CI policy without installing dependencies
        run: |
          node --check scripts/ci/detect-changes.mjs
          node --check scripts/ci/fetch-pr-graph.mjs
          node --check scripts/ci/collect-metrics.mjs
          node --check scripts/ci/aggregate-test-reports.mjs
          node --check scripts/run-playwright-e2e.mjs
          node --test tests/ci-change-detection.test.mjs tests/ci-workflow-contract.test.mjs tests/preview-workflow-contract.test.mjs tests/workflow-security-contract.test.mjs
      - name: Publish fast-gate summary
        if: ${{ always() }}
        env:
          CATEGORIES: ${{ needs.classify-changes.outputs.categories }}
          REASON: ${{ needs.classify-changes.outputs.reason }}
        run: |
          {
            echo '## fast-gate'
            echo "- Categories: \`${CATEGORIES}\`"
            echo "- Reason: ${REASON}"
            echo '- No npm install or browser setup is performed here.'
          } >> "$GITHUB_STEP_SUMMARY"

  static-quality:
    name: static-quality
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.run_static == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository and static checks
        run: |
          npm run lint
          npm run typecheck
          npm run test:unique-menu-design
          npm run test:qr:node
          npm run test:admin
          npm run test:maison-elyse-media
      - name: Deterministic Node contracts
        run: |
          npm run test:landing:contract
          npm run test:landing:i18n
          npm run test:landing:fixture-i18n
          npm run test:landing:keyboard
          npm run test:translation:backfill
          npm run test:seo
      - name: Job summary
        if: ${{ always() }}
        env:
          CATEGORIES: ${{ needs.classify-changes.outputs.categories }}
          REASON: ${{ needs.classify-changes.outputs.reason }}
        run: |
          {
            echo "## static-quality"
            echo "- Categories: \`${CATEGORIES}\`"
            echo "- Reason: ${REASON}"
          } >> "$GITHUB_STEP_SUMMARY"

  database-contracts:
    name: database-contracts
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.run_database == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # postgres:17.10 multi-platform index digest verified 2026-08-03.
        image: postgres:17.10@sha256:a426e44bac0b759c95894d68e1a0ac03ecc20b619f498a91aae373bf06d8508d
        env:
          POSTGRES_DB: vistaire_qr_ci
          POSTGRES_PASSWORD: vistaire_qr_ci_password
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vistaire_qr_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: PostgreSQL contracts
        env:
          PGDATABASE: vistaire_qr_ci
          PGHOST: 127.0.0.1
          PGPASSWORD: vistaire_qr_ci_password
          PGPORT: '5432'
          PGUSER: postgres
        run: |
          npm run test:unique-menu-design:postgres
          npm run test:translation:backfill:postgres
          npm run test:maison-elyse-postgres
          npm run test:qr:postgres
      - name: Job summary
        if: ${{ always() }}
        env:
          CATEGORIES: ${{ needs.classify-changes.outputs.categories }}
        run: |
          echo "## database-contracts" >> "$GITHUB_STEP_SUMMARY"
          echo "- Categories: \`${CATEGORIES}\`" >> "$GITHUB_STEP_SUMMARY"

  build-app:
    name: build-app
    needs: classify-changes
    if: ${{ !cancelled() && needs.classify-changes.outputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Next replaces NEXT_PUBLIC_* values in the server bundle at build time.
    # Use the hermetic fixture endpoint so production E2E jobs and the single
    # uploaded .next artifact resolve the same deterministic menu dataset.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55434
      SUPABASE_SERVICE_ROLE_KEY: sauge-noire-fixture-service-role-key
      VISTAIRE_EXPECTED_SUPABASE_PROJECT_REF: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Next.js once against the hermetic fixture
        run: |
          node e2e/support/sauge-noire-fixture-server.mjs > "$RUNNER_TEMP/sauge-fixture.log" 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:55434/fixture/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:55434/fixture/health > /dev/null
          npm run build
      - name: Upload verified Next.js build
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: next-build-${{ github.run_id }}
          path: .next
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true
      - name: Job summary
        if: ${{ always() }}
        run: |
          echo '## build-app' >> "$GITHUB_STEP_SUMMARY"
          { du -sh .next 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"

  e2e-public-chromium:
    name: e2e-public-chromium
    needs: [classify-changes, fast-gate, static-quality, build-app]
    if: >-
      !cancelled() && needs.classify-changes.result == 'success' &&
      needs.fast-gate.result == 'success' && needs.static-quality.result == 'success' &&
      needs.build-app.result == 'success' &&
      (needs.classify-changes.outputs.run_core == 'true' ||
      needs.classify-changes.outputs.run_landing == 'true' ||
      needs.classify-changes.outputs.run_menu == 'true' ||
      needs.classify-changes.outputs.run_seo == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      test_report: ${{ steps.publish-test-report.outputs.report }}
    env:
      CI_TEST_REPORT_PATH: ${{ github.workspace }}/.ci-test-report-e2e-public-chromium.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Chromium once for public suites
        run: npx --no-install playwright install --with-deps chromium
      - name: Download verified Next.js build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: next-build-${{ github.run_id }}
          path: .next
      - name: Core browser smoke
        if: ${{ !cancelled() && needs.classify-changes.outputs.run_core == 'true' }}
        env:
          CI_TEST_REPORT_PATH: ${{ github.workspace }}/.ci-test-report-core.json
        run: npm run test:ci:e2e:core
      - name: Landing browser smoke
        if: ${{ !cancelled() && needs.classify-changes.outputs.run_landing == 'true' }}
        env:
          CI_TEST_REPORT_PATH: ${{ github.workspace }}/.ci-test-report-landing.json
        run: npm run test:ci:e2e:landing
      - name: Shared menu browser smoke
        if: ${{ !cancelled() && needs.classify-changes.outputs.run_menu == 'true' }}
        env:
          CI_TEST_REPORT_PATH: ${{ github.workspace }}/.ci-test-report-menu.json
        run: npm run test:ci:e2e:menu
      - name: SEO browser smoke
        if: ${{ !cancelled() && needs.classify-changes.outputs.run_seo == 'true' }}
        env:
          CI_TEST_REPORT_PATH: ${{ github.workspace }}/.ci-test-report-seo.json
