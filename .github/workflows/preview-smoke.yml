name: Preview Gate

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: vistaire-preview-gate-${{ github.event.deployment_status.deployment_id || github.run_id }}
  cancel-in-progress: true

jobs:
  preview-gate:
    name: Preview Gate
    if: >-
      github.repository == 'MarcSaad-Hadidi/Vistaire' &&
      github.event.deployment_status.environment == 'Preview' &&
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview-gate
    steps:
      - name: Validate trusted Preview identity
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const status = event.deployment_status ?? {};
          const deployment = event.deployment ?? {};
          if (event.repository?.full_name !== process.env.EXPECTED_REPOSITORY) throw new Error('unexpected deployment repository');
          if (deployment.repository?.full_name && deployment.repository.full_name !== process.env.EXPECTED_REPOSITORY) throw new Error('unexpected deployment repository metadata');
          if (status.environment !== 'Preview' || status.state !== 'success') throw new Error('deployment is not a successful Preview');
          if (!/^[0-9a-f]{40}$/i.test(String(deployment.sha ?? ''))) throw new Error('deployment SHA is not exact');
          const url = new URL(process.env.PREVIEW_URL ?? '');
          if (url.protocol !== 'https:') throw new Error('Preview URL must use HTTPS');
          if (!/^vistaire-[a-z0-9-]+-capoships-projects\.vercel\.app$/i.test(url.hostname)) throw new Error('Preview URL is not the allowlisted Vistaire Vercel preview host');
          console.log(`Validated Preview ${url.origin} for ${deployment.sha}`);
          NODE

      # This checkout is the trusted default branch. The deployment URL is the
      # only untrusted input; no PR ref is checked out and no PR code receives
      # the protected Vercel bypass secret.
      - name: Checkout trusted smoke harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 1
          lfs: false
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Install trusted smoke dependencies
        run: npm ci
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run protected Preview smoke
        env:
          CI: true
          PLAYWRIGHT_SKIP_WEB_SERVER: '1'
          PLAYWRIGHT_BASE_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CI_TEST_REPORT_PATH: ${{ runner.temp }}/vistoire-preview-gate.json
        run: |
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo '::error::Preview Gate cannot run without VERCEL_AUTOMATION_BYPASS_SECRET in the protected preview-gate environment.'
            {
              echo '### Preview Gate failed closed'
              echo '- `VERCEL_AUTOMATION_BYPASS_SECRET` is not configured in the protected `preview-gate` environment.'
              echo '- No remote page was executed; this check is intentionally not green when validation did not run.'
              echo '- Configure the secret and rerun the deployment status check.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node ./node_modules/@playwright/test/cli.js test e2e/preview-smoke.spec.ts --project=chromium --workers=1 --retries=0 --forbid-only --reporter=list,./e2e/support/forbid-skipped-tests-reporter.ts
      - name: Validate Preview structured report
        if: ${{ success() }}
        env:
          REPORT_PATH: ${{ runner.temp }}/vistoire-preview-gate.json
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync(process.env.REPORT_PATH, 'utf8'));
          if (!Number.isInteger(report.total) || report.total < 1) throw new Error('Preview Gate produced no test results');
          for (const key of ['passed', 'failed', 'skipped', 'flaky', 'interrupted']) {
            if (!Number.isInteger(report[key]) || report[key] < 0) throw new Error(`Preview report field ${key} is invalid`);
          }
          if (report.skipped !== 0 || report.interrupted !== 0) throw new Error('Preview Gate must not skip or interrupt tests');
          if (report.passed + report.failed + report.flaky !== report.total) throw new Error('Preview report totals are inconsistent');
          const lines = [
            '### Preview Gate test report',
            `- Total: ${report.total}`,
            `- Passed: ${report.passed}`,
            `- Failed: ${report.failed}`,
            `- Flaky: ${report.flaky}`,
            `- Skipped: ${report.skipped}`,
            `- Interrupted: ${report.interrupted}`
          ];
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\\n')}\\n`);
          NODE
      - name: Upload Preview diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: preview-gate-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Publish Preview Gate summary
        if: ${{ always() }}
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          DEPLOYMENT_SHA: ${{ github.event.deployment.sha }}
        run: |
          {
            echo '## Preview Gate'
            echo "- Preview URL: ${PREVIEW_URL}"
            echo "- Deployment SHA: ${DEPLOYMENT_SHA}"
            echo '- Harness: trusted `main` checkout; no PR ref or PR secret execution.'
          } >> "$GITHUB_STEP_SUMMARY"
