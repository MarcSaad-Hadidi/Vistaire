name: Temporary js-yaml audit baseline refresh

on:
  push:
    branches:
      - fix/js-yaml-4-3-2
    paths:
      - .github/workflows/tmp-js-yaml-baseline-refresh.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/js-yaml-4-3-2
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install and prove resolved dependency
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm ls js-yaml --all
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/js-yaml']?.version!=='4.3.2') throw new Error('js-yaml is not 4.3.2')"
          npm audit --audit-level=high

      - name: Refresh lockfile-bound zero-advisory baseline
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const lockText = readFileSync('package-lock.json', 'utf8').replace(/\r\n/g, '\n');
          const hash = createHash('sha256').update(lockText).digest('hex');
          const path = 'ci/npm-audit-baseline.json';
          const baseline = JSON.parse(readFileSync(path, 'utf8'));

          if (!Array.isArray(baseline.entries) || baseline.entries.length !== 0) {
            throw new Error('Expected the current npm audit baseline to have zero advisory entries');
          }

          baseline.lockfile_sha256 = hash;
          writeFileSync(path, `${JSON.stringify(baseline, null, 2)}\n`);
          console.log(`Refreshed baseline lockfile_sha256=${hash}`);
          NODE

          npm audit --json > npm-audit.json || test -s npm-audit.json
          node scripts/ci/check-npm-audit-baseline.mjs npm-audit.json ci/npm-audit-baseline.json
          git diff --check

      - name: Commit verified baseline and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-js-yaml-baseline-refresh.yml
          git add ci/npm-audit-baseline.json
          git diff --cached --check
          git commit -m "chore(security): refresh npm audit lockfile baseline"
          git push origin HEAD:fix/js-yaml-4-3-2
