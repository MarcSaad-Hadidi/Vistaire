name: Temporary dependency consolidation diagnostics

on:
  push:
    branches:
      - chore/consolidate-dependency-updates

permissions:
  contents: read

jobs:
  trace-closure-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Diagnose runtime closure edges from current lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages || {};
          const roots = [
            '@babylonjs/core',
            '@babylonjs/loaders',
            '@babylonjs/serializers',
            '@gltf-transform/cli',
            '@gltf-transform/core',
            '@gltf-transform/extensions',
            '@gltf-transform/functions',
            'fflate',
          ].map((name) => `node_modules/${name}`);

          function resolve(parentPath, name) {
            const nested = `${parentPath}/node_modules/${name}`;
            return packages[nested] ? nested : `node_modules/${name}`;
          }

          const seen = new Set();
          const queue = roots.map((path) => ({ path, chain: [path] }));
          const typeEdges = [];
          while (queue.length) {
            const current = queue.shift();
            if (!current || seen.has(current.path)) continue;
            seen.add(current.path);
            const entry = packages[current.path];
            if (!entry) continue;

            const groups = [
              ['dependency', entry.dependencies || {}],
              ['optionalDependency', entry.optionalDependencies || {}],
              ['peerDependency', entry.peerDependencies || {}],
            ];
            for (const [kind, deps] of groups) {
              for (const name of Object.keys(deps)) {
                const child = resolve(current.path, name);
                const peerMeta = kind === 'peerDependency' ? entry.peerDependenciesMeta?.[name] : undefined;
                const detail = {
                  parent: current.path,
                  child,
                  name,
                  kind,
                  peerOptional: peerMeta?.optional === true,
                  parentDev: entry.dev === true,
                  parentPeer: entry.peer === true,
                  childDev: packages[child]?.dev === true,
                  childPeer: packages[child]?.peer === true,
                  chain: [...current.chain, `${kind}:${child}`],
                };
                if (child.startsWith('node_modules/@types/')) typeEdges.push(detail);
                if (!seen.has(child)) queue.push({ path: child, chain: detail.chain });
              }
            }
          }

          console.log(`RUNTIME_CLOSURE_SIZE=${seen.size}`);
          console.log(`TYPE_EDGE_COUNT=${typeEdges.length}`);
          for (const edge of typeEdges) console.log(JSON.stringify(edge));

          const runtimeOnly = new Set();
          const runtimeQueue = [...roots];
          while (runtimeQueue.length) {
            const path = runtimeQueue.shift();
            if (!path || runtimeOnly.has(path)) continue;
            runtimeOnly.add(path);
            const entry = packages[path];
            if (!entry) continue;
            for (const deps of [entry.dependencies || {}, entry.optionalDependencies || {}]) {
              for (const name of Object.keys(deps)) runtimeQueue.push(resolve(path, name));
            }
          }
          console.log(`DEPENDENCY_OPTIONAL_ONLY_CLOSURE_SIZE=${runtimeOnly.size}`);
          console.log(`AT_TYPES_IN_DEPENDENCY_OPTIONAL_ONLY=${[...runtimeOnly].filter((p) => p.startsWith('node_modules/@types/')).length}`);
          NODE
