name: Temporary dependency consolidation

on:
  push:
    branches:
      - chore/consolidate-dependency-updates

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Apply dependency and CI migrations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packagePath = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(packagePath, 'utf8'));
          Object.assign(pkg.dependencies, {
            '@babylonjs/core': '^9.22.1',
            '@babylonjs/loaders': '^9.22.1',
            '@babylonjs/serializers': '^9.22.1',
            '@clerk/nextjs': '^7.8.0',
            '@getbrevo/brevo': '^6.0.3',
            '@gltf-transform/cli': '^4.4.2',
            '@google/model-viewer': '^4.3.1',
            '@supabase/ssr': '^0.12.4',
            fflate: '^0.8.3',
            lenis: '^1.3.26',
            meshoptimizer: '~1.2.0',
            next: '^16.3.2',
            react: '^19.2.8',
            'react-dom': '^19.2.8',
          });
          Object.assign(pkg.devDependencies, {
            '@playwright/test': '^1.62.1',
            '@tailwindcss/postcss': '^4.3.3',
            '@types/node': '^26.2.0',
            eslint: '^10.9.0',
            'eslint-config-next': '^16.3.2',
            postcss: '^8.5.26',
            tailwindcss: '^4.3.3',
            three: '^0.183.2',
            typescript: '^7.0.2',
          });
          delete pkg.devDependencies.autoprefixer;
          fs.writeFileSync(packagePath, `${JSON.stringify(pkg, null, 2)}\n`);

          const codeqlPath = '.github/workflows/codeql.yml';
          let codeql = fs.readFileSync(codeqlPath, 'utf8');
          const oldCodeql = '5595ccaf912efad79be6eef63a5619ff05969be3';
          const newCodeql = 'db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28';
          if ((codeql.match(new RegExp(oldCodeql, 'g')) || []).length !== 2) {
            throw new Error('Expected exactly two CodeQL v4.37.6 pins before migration.');
          }
          codeql = codeql.replaceAll(oldCodeql, newCodeql);
          fs.writeFileSync(codeqlPath, codeql);

          const contractPath = 'tests/admin-e2e-ci-contract.test.mjs';
          let contract = fs.readFileSync(contractPath, 'utf8');
          const oldContract = `test("CodeQL keeps analysis failures blocking and publishes SARIF", async () => {
            const workflow = await source(".github/workflows/codeql.yml");
            const codeqlV4Commit = "5595ccaf912efad79be6eef63a5619ff05969be3";

            assert.match(workflow, new RegExp(\`uses:\\\\s*github/codeql-action/analyze@\${codeqlV4Commit}\\\\s+# v4\`));
            assert.match(workflow, new RegExp(\`uses:\\\\s*github/codeql-action/init@\${codeqlV4Commit}\\\\s+# v4\`));
            assert.match(workflow, /uses:\\s*actions\\/checkout@[0-9a-f]{40}\\s+# v4\\.4\\.0/);
            assert.doesNotMatch(workflow, /upload:\\s*never/);
            assert.match(workflow, /security-events:\\s*write/);
            assert.doesNotMatch(workflow, /continue-on-error/);
          });`;
          const newContract = `test("CodeQL keeps analysis failures blocking and publishes SARIF", async () => {
            const workflow = await source(".github/workflows/codeql.yml");
            const initPin = workflow.match(/uses:\\s*github\\/codeql-action\\/init@([0-9a-f]{40})\\s+# v4/);
            const analyzePin = workflow.match(/uses:\\s*github\\/codeql-action\\/analyze@([0-9a-f]{40})\\s+# v4/);

            assert.ok(initPin, "CodeQL init must use an immutable 40-character commit pin");
            assert.ok(analyzePin, "CodeQL analyze must use an immutable 40-character commit pin");
            assert.equal(initPin[1], analyzePin[1], "CodeQL init and analyze must use the same action revision");
            assert.match(workflow, /uses:\\s*actions\\/checkout@[0-9a-f]{40}\\s+# v4\\.4\\.0/);
            assert.doesNotMatch(workflow, /upload:\\s*never/);
            assert.match(workflow, /security-events:\\s*write/);
            assert.doesNotMatch(workflow, /continue-on-error/);
          });`;
          if (!contract.includes(oldContract)) throw new Error('CodeQL contract block drifted; refusing an unsafe replacement.');
          contract = contract.replace(oldContract, newContract);
          fs.writeFileSync(contractPath, contract);

          const securityPath = '.github/workflows/workflow-security.yml';
          let security = fs.readFileSync(securityPath, 'utf8');
          security = security
            .replace('Run actionlint 0.1.3 (immutable action revision)', 'Run actionlint 0.1.13 (immutable action revision)')
            .replace('devops-actions/actionlint@e7ee33fbf5aa8c9f9ee1145137f3e52e25d6a35b # v0.1.3', 'devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13');
          fs.writeFileSync(securityPath, security);

          const cssPath = 'app/globals.css';
          let css = fs.readFileSync(cssPath, 'utf8');
          const oldTailwindHeader = '@tailwind base;\n@tailwind components;\n@tailwind utilities;';
          const newTailwindHeader = `@import "tailwindcss";\n@config "../tailwind.config.ts";\n\n@theme {\n  --default-ring-width: 3px;\n  --default-ring-color: var(--color-blue-500);\n}\n\n@layer base {\n  *,\n  ::after,\n  ::before,\n  ::backdrop,\n  ::file-selector-button {\n    border-color: var(--color-gray-200, currentColor);\n  }\n}`;
          if (!css.includes(oldTailwindHeader)) throw new Error('Tailwind v3 CSS header not found.');
          css = css.replace(oldTailwindHeader, newTailwindHeader);
          fs.writeFileSync(cssPath, css);

          fs.writeFileSync('postcss.config.js', `module.exports = {\n  plugins: {\n    "@tailwindcss/postcss": {},\n  },\n};\n`);
          NODE

          cat > .github/dependabot.yml <<'YAML'
          version: 2
          updates:
            - package-ecosystem: npm
              directory: "/"
              schedule:
                interval: weekly
                day: monday
                time: "04:00"
                timezone: UTC
              open-pull-requests-limit: 10
              cooldown:
                default-days: 7
              groups:
                three-model-viewer:
                  patterns:
                    - "@google/model-viewer"
                    - "three"
                production-dependencies:
                  dependency-type: production
                  update-types:
                    - "minor"
                    - "patch"
                development-dependencies:
                  dependency-type: development
                  update-types:
                    - "minor"
                    - "patch"

            - package-ecosystem: github-actions
              directory: "/"
              schedule:
                interval: weekly
                day: monday
                time: "04:15"
                timezone: UTC
              open-pull-requests-limit: 10
              cooldown:
                default-days: 7
              groups:
                codeql-actions:
                  patterns:
                    - "github/codeql-action/*"
          YAML

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate deterministic install
        run: npm ci --ignore-scripts

      - name: Refresh audit evidence without accepting new advisories
        shell: bash
        run: |
          npm audit --json > npm-audit.json || test -s npm-audit.json
          node <<'NODE'
          const { createHash } = require('node:crypto');
          const fs = require('node:fs');
          const baselinePath = 'ci/npm-audit-baseline.json';
          const baseline = JSON.parse(fs.readFileSync(baselinePath, 'utf8'));
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const lockText = fs.readFileSync('package-lock.json', 'utf8').replace(/\r\n/g, '\n');
          const active = new Set();
          for (const vulnerability of Object.values(report.vulnerabilities || {})) {
            for (const via of vulnerability.via || []) {
              if (typeof via !== 'object' || !via.url) continue;
              if (!['high', 'critical'].includes(String(via.severity).toLowerCase())) continue;
              active.add(via.url.split('/').pop());
            }
          }
          baseline.lockfile_sha256 = createHash('sha256').update(lockText).digest('hex');
          baseline.entries = baseline.entries.filter((entry) => active.has(entry.advisory_id));
          fs.writeFileSync(baselinePath, `${JSON.stringify(baseline, null, 2)}\n`);
          NODE
          node scripts/ci/check-npm-audit-baseline.mjs npm-audit.json ci/npm-audit-baseline.json

      - name: Run focused security contract tests
        run: node --test tests/npm-audit-baseline.test.mjs tests/admin-e2e-ci-contract.test.mjs

      - name: Run static validation
        run: |
          npm run lint
          npm run typecheck
          npm run assets:check
          npm run lfs:check

      - name: Build production application
        run: npm run build

      - name: Commit consolidated maintenance changes
        shell: bash
        run: |
          rm -f npm-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json ci/npm-audit-baseline.json .github/dependabot.yml .github/workflows/codeql.yml .github/workflows/workflow-security.yml tests/admin-e2e-ci-contract.test.mjs app/globals.css postcss.config.js
          git diff --cached --check
          git commit -m "chore: consolidate dependency upgrades"
          git push
