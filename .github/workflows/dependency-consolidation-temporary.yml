name: Temporary dependency consolidation diagnostics

on:
  push:
    branches:
      - chore/consolidate-dependency-updates

permissions:
  contents: read

jobs:
  lockfile-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Prove baseline runtime trace
        run: |
          npm ci --ignore-scripts
          node --test tests/owner-gltf-runtime-toolchain.test.mjs

      - name: Compare lockfile generators without dependency changes
        shell: bash
        run: |
          set -u
          baseline_sha="$(sha256sum package-lock.json | awk '{print $1}')"
          echo "BASELINE_LOCK_SHA=$baseline_sha"

          try_generator() {
            label="$1"
            shift
            git checkout -- package.json package-lock.json
            rm -rf node_modules
            echo "=== $label: regenerate unchanged lockfile ==="
            "$@" install --package-lock-only --ignore-scripts
            current_sha="$(sha256sum package-lock.json | awk '{print $1}')"
            echo "${label}_LOCK_SHA=$current_sha"
            if [ "$baseline_sha" = "$current_sha" ]; then
              echo "${label}_LOCK_IDENTICAL=true"
            else
              echo "${label}_LOCK_IDENTICAL=false"
            fi
            npm ci --ignore-scripts >/dev/null
            if node --test tests/owner-gltf-runtime-toolchain.test.mjs; then
              echo "${label}_TRACE_PARITY=true"
            else
              echo "${label}_TRACE_PARITY=false"
            fi
          }

          try_generator npm11 npm
          try_generator npm10 npx --yes npm@10.9.4
          try_generator npm9 npx --yes npm@9.9.4

          git checkout -- package.json package-lock.json
          rm -rf node_modules
          npm ci --ignore-scripts >/dev/null
