name: Maison Elyse fix bootstrap

on:
  push:
    branches:
      - fix/maison-elyse-i18n-currency-rtl
    paths:
      - .github/workflows/maison-elyse-fix-bootstrap.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: fix/maison-elyse-i18n-currency-rtl
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm regression test is red before implementation
        shell: bash
        run: |
          set +e
          node --test tests/maison-elyse-i18n-currency-rtl.test.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Regression test unexpectedly passed before the implementation patch."
            exit 1
          fi
          echo "Regression reproduced as expected (exit $status)."

      - name: Apply scoped implementation patch
        run: python3 .github/scripts/apply-maison-elyse-fix.py

      - name: Targeted regression tests
        run: >-
          node --test
          tests/maison-elyse-i18n-currency-rtl.test.mjs
          tests/maison-elyse-locales.test.mjs
          tests/maison-elyse-qr-menu-source.test.mjs
          tests/trouvable-menu-controls.test.mjs
          tests/sauge-noire-renderer-contract.test.mjs
          tests/sauge-noire-fixture-i18n-integration.test.mjs
          tests/public-menu-core.test.mjs
          tests/public-menu-detail-source.test.mjs

      - name: Asset policy
        run: npm run assets:check

      - name: LFS policy
        run: npm run lfs:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff hygiene
        run: git diff --check

      - name: Commit validated implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No implementation diff produced."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            components/menu/MaisonElyseQrMenu.tsx \
            components/menu/MaisonElyseDishDetail.tsx \
            components/menu/unique/sauge-noire/SaugeNoireBookMenu.tsx \
            lib/menu/publicMenuRenderContext.ts \
            'app/(fr)/menu/[slug]/page.tsx' \
            'app/(fr)/menu/[slug]/dishes/[dishSlug]/page.tsx' \
            tests/maison-elyse-locales.test.mjs \
            tests/maison-elyse-qr-menu-source.test.mjs \
            tests/maison-elyse-i18n-currency-rtl.test.mjs
          git commit -m "fix(maison-elyse): localize controls currency and RTL behavior"
          git push origin HEAD:fix/maison-elyse-i18n-currency-rtl
