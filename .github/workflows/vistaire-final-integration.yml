name: Vistaire final integration probe

on:
  push:
    branches:
      - perf/vistaire-final-free-tier-optimization
    paths:
      - .github/workflows/vistaire-final-integration.yml
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/vistaire-final-integration.yml

permissions:
  contents: read

concurrency:
  group: vistaire-final-integration-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Probe merge of PR 211 then PR 209
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "vistaire-integration-bot"
          git config user.email "vistaire-integration-bot@users.noreply.github.com"
          git fetch --no-tags origin \
            main \
            perf/vercel-fluid-cpu-static-public \
            perf/supabase-efficiency-v2

          git merge --no-ff --no-edit origin/perf/vercel-fluid-cpu-static-public \
            -m "merge: integrate Vercel static public optimization"

          set +e
          git merge --no-ff --no-edit origin/perf/supabase-efficiency-v2 \
            -m "merge: integrate Supabase media efficiency"
          merge_status=$?
          set -e
          echo "merge_status=${merge_status}" >> "$GITHUB_OUTPUT"

          mkdir -p integration-conflicts
          git diff --name-only --diff-filter=U > integration-conflicts/conflicts.txt

          index=0
          while IFS= read -r -d '' path; do
            index=$((index + 1))
            directory="integration-conflicts/$(printf '%03d' "$index")"
            mkdir -p "$directory"
            printf '%s\n' "$path" > "$directory/path.txt"
            git show ":1:$path" > "$directory/base" 2>/dev/null || true
            git show ":2:$path" > "$directory/pr211" 2>/dev/null || true
            git show ":3:$path" > "$directory/pr209" 2>/dev/null || true
            cp -- "$path" "$directory/conflicted"
          done < <(git diff --name-only --diff-filter=U -z)

          printf '%s\n' "$index" > integration-conflicts/count.txt
          git status --short > integration-conflicts/status.txt
          git diff --stat > integration-conflicts/diff-stat.txt || true
          echo "Archived ${index} conflict sets."

      - name: Upload conflict stages
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: vistaire-final-integration-conflicts
          path: integration-conflicts
          if-no-files-found: error
          retention-days: 1

      - name: Fail when conflicts remain
        if: steps.probe.outputs.merge_status != '0'
        shell: bash
        run: exit 1
