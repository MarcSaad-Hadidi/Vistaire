name: Asset Policy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vistaire-asset-policy-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true

jobs:
  asset-policy:
    name: Asset policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Fetch minimal PR graph for merge-base
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node scripts/ci/fetch-pr-graph.mjs

      - name: Classify asset impact
        id: classify
        run: node scripts/ci/detect-changes.mjs

      - name: Setup Node
        if: ${{ steps.classify.outputs.assets == 'true' || steps.classify.outputs.full_ci == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ steps.classify.outputs.assets == 'true' || steps.classify.outputs.full_ci == 'true' }}
        run: npm ci

      - name: Large file guard
        if: ${{ steps.classify.outputs.assets == 'true' || steps.classify.outputs.full_ci == 'true' }}
        run: npm run assets:check

      - name: LFS policy guard
        if: ${{ steps.classify.outputs.assets == 'true' || steps.classify.outputs.full_ci == 'true' }}
        run: npm run lfs:check

      - name: Publish summary
        if: ${{ always() }}
        run: |
          {
            echo '## Asset policy'
            echo "- Asset/infrastructure impact: \`${{ steps.classify.outputs.assets }}\` / \`${{ steps.classify.outputs.full_ci }}\`"
            echo '- Pure documentation-only changes intentionally skip npm installation; documentation media remains subject to asset guards.'
          } >> "$GITHUB_STEP_SUMMARY"
