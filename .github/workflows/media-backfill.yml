name: Dish Photo Derivative Backfill

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only inventory, measurement or verification; apply requires separate approval.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - apply
          - measure-only
          - verify-only
      canary_restaurant_id:
        description: Required for measure-only, verify-only and apply. Optional scope for dry-run.
        required: false
        default: ""
        type: string
      confirmation:
        description: Type APPLY-DISH-PHOTO-BACKFILL only when mode is apply.
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: vistaire-dish-photo-backfill-production
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  BACKFILL_MODE: ${{ inputs.mode }}
  BACKFILL_CONFIRMATION: ${{ inputs.confirmation }}
  CANARY_RESTAURANT_ID: ${{ inputs.canary_restaurant_id }}
  VISTAIRE_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.VISTAIRE_EXPECTED_SUPABASE_PROJECT_REF }}
  VISTAIRE_MEDIA_BACKFILL_ALLOW_APPLY: ${{ vars.VISTAIRE_MEDIA_BACKFILL_ALLOW_APPLY }}
  VISTAIRE_MEDIA_WRITES_ENABLED: ${{ vars.VISTAIRE_MEDIA_WRITES_ENABLED }}

jobs:
  backfill:
    name: Dish photo derivative backfill
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate trusted manual request
        shell: bash
        run: |
          set -euo pipefail
          uuid_regex='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
          case "$BACKFILL_MODE" in
            dry-run)
              if [[ -n "$CANARY_RESTAURANT_ID" && ! "$CANARY_RESTAURANT_ID" =~ $uuid_regex ]]; then
                echo "Read-only blocked: restaurant id must be a UUID." >&2
                exit 1
              fi
              ;;
            measure-only|verify-only)
              if [[ -z "$CANARY_RESTAURANT_ID" || ! "$CANARY_RESTAURANT_ID" =~ $uuid_regex ]]; then
                echo "Read-only blocked: an explicit restaurant UUID is required." >&2
                exit 1
              fi
              ;;
            apply)
              if [[ -z "$CANARY_RESTAURANT_ID" ]]; then
                echo "Apply blocked: canary restaurant is required." >&2
                exit 1
              fi
              if [[ ! "$CANARY_RESTAURANT_ID" =~ $uuid_regex ]]; then
                echo "Apply blocked: canary restaurant id must be a UUID." >&2
                exit 1
              fi
              if [[ "$BACKFILL_CONFIRMATION" != "APPLY-DISH-PHOTO-BACKFILL" ]]; then
                echo "Apply blocked: exact confirmation phrase is required." >&2
                exit 1
              fi
              if [[ "$VISTAIRE_MEDIA_BACKFILL_ALLOW_APPLY" != "1" ]]; then
                echo "Apply blocked: repository backfill opt-in is not enabled." >&2
                exit 1
              fi
              if [[ "$VISTAIRE_MEDIA_WRITES_ENABLED" != "true" ]]; then
                echo "Apply blocked: repository media-write kill switch is not enabled." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported backfill mode." >&2
              exit 1
              ;;
          esac

      - name: Checkout exact trusted revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: false
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare ephemeral reports
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          report_dir="$(mktemp -d "$RUNNER_TEMP/vistaire-dish-photo-backfill.XXXXXX")"
          echo "REPORT_DIR=$report_dir" >> "$GITHUB_ENV"

      - name: Validate configured Supabase production target
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module - <<'NODE'
          const rawUrl = process.env.NEXT_PUBLIC_SUPABASE_URL?.trim() ?? '';
          const serviceRoleKey = process.env.SUPABASE_SERVICE_ROLE_KEY?.trim() ?? '';
          const expectedRef = process.env.VISTAIRE_EXPECTED_SUPABASE_PROJECT_REF?.trim().toLowerCase() ?? '';
          if (!rawUrl || !serviceRoleKey || !expectedRef) {
            throw new Error('Production Supabase configuration is incomplete.');
          }
          let url;
          try {
            url = new URL(rawUrl);
          } catch {
            throw new Error('Production Supabase target is not a valid URL.');
          }
          if (!/^[a-z0-9]{20}$/.test(expectedRef) ||
              url.origin !== `https://${expectedRef}.supabase.co` ||
              url.username || url.password || url.pathname !== '/' || url.search || url.hash) {
            throw new Error('Configured Supabase project does not match the expected production project ref.');
          }
          console.log('Validated configured production Supabase target.');
          NODE

      - name: Run read-only dry-run inventory
        id: inventory
        if: ${{ inputs.mode == 'dry-run' || inputs.mode == 'apply' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VISTAIRE_MEDIA_BACKFILL_ALLOW_APPLY: "0"
          VISTAIRE_MEDIA_WRITES_ENABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scope=()
          if [[ -n "$CANARY_RESTAURANT_ID" ]]; then
            scope+=(--restaurant-id="$CANARY_RESTAURANT_ID")
          fi
          if ! node scripts/backfill-dish-photo-derivatives.mjs \
            --checkpoint="$REPORT_DIR/checkpoint.json" "${scope[@]}" \
            > "$REPORT_DIR/dry-run.log" 2> "$REPORT_DIR/dry-run.stderr"; then
            echo "::error::Read-only inventory failed. Inspect the same scoped command in a private operator session; no media writes were requested by this step."
            exit 1
          fi
          echo 'Read-only inventory command completed; detailed output remains private.'

      - name: Measure exact derivative capacity before apply
        id: measure
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'measure-only' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VISTAIRE_MEDIA_BACKFILL_ALLOW_APPLY: "0"
          VISTAIRE_MEDIA_WRITES_ENABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! node scripts/backfill-dish-photo-derivatives.mjs \
            --measure-only \
            --restaurant-id="$CANARY_RESTAURANT_ID" \
            --checkpoint="$REPORT_DIR/checkpoint.json" \
            > "$REPORT_DIR/measure.json" 2> "$REPORT_DIR/measure.stderr"; then
            echo "::error::Read-only capacity measurement failed. Check the authoritative quota, fresh usage and source integrity privately. Apply remains blocked."
            exit 1
          fi
          MEASURE_REPORT="$REPORT_DIR/measure.json" node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          let report;
          try {
            report = JSON.parse(readFileSync(process.env.MEASURE_REPORT, 'utf8'));
          } catch {
            throw new Error('Capacity measurement returned an unreadable report. Apply remains blocked.');
          }
          if (!report || report.status !== 'pass' || report.pass !== true) {
            throw new Error('Capacity measurement did not pass. Apply remains blocked.');
          }
          if (!Number.isSafeInteger(report.rowCount) || report.rowCount < 1 || !Number.isSafeInteger(report.sourceCount) || report.sourceCount < 1) {
            throw new Error('Canary restaurant has no valid photo sources.');
          }
          if (!Number.isSafeInteger(report.uniqueAdditionalBytes) || report.uniqueAdditionalBytes < 0 ||
              !Number.isFinite(report.headroomAfterPercent) || report.headroomAfterPercent < 20 || report.headroomAfterPercent > 100) {
            throw new Error('Capacity measurement summary is invalid. Apply remains blocked.');
          }
          // Only validated aggregate numbers may enter public Actions logs.
          // Keep the original, complete report unchanged for the apply gate.
          console.log(JSON.stringify({
            status: 'pass',
            rowCount: report.rowCount,
            sourceCount: report.sourceCount,
            uniqueAdditionalBytes: report.uniqueAdditionalBytes,
            headroomAfterPercent: report.headroomAfterPercent
          }, null, 2));
          NODE

      - name: Apply measured derivative backfill
        id: apply
        if: ${{ inputs.mode == 'apply' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! node scripts/backfill-dish-photo-derivatives.mjs \
            --apply --confirm-production \
            --restaurant-id="$CANARY_RESTAURANT_ID" \
            --measure-report="$REPORT_DIR/measure.json" \
            --checkpoint="$REPORT_DIR/checkpoint.json" \
            > "$REPORT_DIR/apply.log" 2> "$REPORT_DIR/apply.stderr"; then
            echo "::error::Apply failed or is incomplete. Reconcile retained objects and reservations privately before any retry; no automatic rollback or retry is authorized."
            exit 1
          fi
          echo 'Apply command completed; post-apply verification must still pass.'

      - name: Verify derivative metadata and Storage objects after apply
        id: verify
        if: ${{ inputs.mode == 'apply' || inputs.mode == 'verify-only' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VISTAIRE_MEDIA_BACKFILL_ALLOW_APPLY: "0"
          VISTAIRE_MEDIA_WRITES_ENABLED: "false"
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          if ! node scripts/backfill-dish-photo-derivatives.mjs \
            --verify-only --verify-hash \
            --restaurant-id="$CANARY_RESTAURANT_ID" \
            --checkpoint="$REPORT_DIR/checkpoint.json" \
            > "$REPORT_DIR/verify.log" 2> "$REPORT_DIR/verify.stderr"; then
            echo "::error::Read-only verification failed. Inspect scoped metadata, objects and hash limits in a private operator session."
            exit 1
          fi
          echo 'Bounded hash verification command completed; production observation and coverage review remain separate.'

      - name: Publish execution summary
        if: ${{ always() }}
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          MEASURE_OUTCOME: ${{ steps.measure.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          {
            echo '## Dish Photo Derivative Backfill'
            case "$BACKFILL_MODE" in
              dry-run|measure-only|verify-only|apply) echo "- Mode: ${BACKFILL_MODE}" ;;
              *) echo '- Mode: rejected invalid request' ;;
            esac
            echo "- Ref: ${GITHUB_REF}"
            echo "- SHA: ${GITHUB_SHA}"
            if [[ "$BACKFILL_MODE" == "apply" ]]; then
              echo '- Production writes requested: yes; only the approved canary, subject to every existing guard.'
            else
              echo '- Production writes requested: no'
            fi
            echo "- Inventory step: ${INVENTORY_OUTCOME:-not-run}"
            echo "- Measure step: ${MEASURE_OUTCOME:-not-run}"
            echo "- Apply step: ${APPLY_OUTCOME:-not-run}"
            echo "- Verify step: ${VERIFY_OUTCOME:-not-run}"
            echo '- A requested apply is not proof of execution; a command success is not proof of full rollout or TTL observation.'
            echo '- Detailed stdout/stderr, reports and checkpoints are private, ephemeral and never uploaded. Reproduce diagnostics only in an authorized private operator session.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove ephemeral reports
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${REPORT_DIR:-}" && "$REPORT_DIR" == "$RUNNER_TEMP"/vistaire-dish-photo-backfill.* ]]; then
            rm -rf -- "$REPORT_DIR"
          fi
