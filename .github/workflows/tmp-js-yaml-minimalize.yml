name: Temporary minimal js-yaml security patch

on:
  push:
    branches:
      - fix/js-yaml-4-3-2
    paths:
      - .github/workflows/tmp-js-yaml-minimalize.yml

permissions:
  contents: write

jobs:
  minimalize-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout security branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/js-yaml-4-3-2
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Rebuild the patch from current main with only js-yaml changed
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- package-lock.json
          node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'package-lock.json';
          let text = readFileSync(path, 'utf8');
          const before = `    "node_modules/js-yaml": {\n      "version": "4.3.1",\n      "resolved": "https://registry.npmjs.org/js-yaml/-/js-yaml-4.3.1.tgz",\n      "integrity": "sha512-CY6crGq313MX8GkwvB7tzgp99vjQxY1++5y10/BKN/GUfHqWaOGQMNZkBvqSzsZKWk/ijwHlWzzkLulsGHhjWQ==",`;
          const after = `    "node_modules/js-yaml": {\n      "version": "4.3.2",\n      "resolved": "https://registry.npmjs.org/js-yaml/-/js-yaml-4.3.2.tgz",\n      "integrity": "sha512-SFNOvSJ+Dgf/9An904Yx+CgSlIPCkIpao4qo51lpee25TIRejdH3rhR4EZMGoNx3/TP3O+wzWuiTFl4sqbltzA==",`;
          const count = text.split(before).length - 1;
          if (count !== 1) throw new Error(`Expected one js-yaml 4.3.1 lock entry, found ${count}`);
          text = text.replace(before, after);
          writeFileSync(path, text);
          const lock = JSON.parse(text);
          const pkg = lock.packages?.['node_modules/js-yaml'];
          if (pkg?.version !== '4.3.2') throw new Error(`Expected js-yaml 4.3.2, got ${pkg?.version ?? 'missing'}`);
          NODE
          test "$(git diff --numstat origin/main -- package-lock.json)" = $'3\t3\tpackage-lock.json'
          git diff --check origin/main -- package-lock.json

      - name: Verify install and security audit without lockfile mutation
        shell: bash
        run: |
          set -euo pipefail
          before_hash="$(sha256sum package-lock.json | awk '{print $1}')"
          npm ci --ignore-scripts
          after_hash="$(sha256sum package-lock.json | awk '{print $1}')"
          test "$before_hash" = "$after_hash"
          node -e "const l=require('./package-lock.json'); if(l.packages['node_modules/js-yaml'].version!=='4.3.2') process.exit(1)"
          npm audit --audit-level=high

      - name: Commit minimal verified patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-js-yaml-minimalize.yml
          git add package-lock.json
          git diff --cached --check
          git commit -m "fix(security): keep js-yaml patch minimal"
          git push origin HEAD:fix/js-yaml-4-3-2
